{% extends 'core/base.html' %} 
{% load static %} 
{% block title %}Borrar Incidente{% endblock %} 
{% block content %} 
{% include 'incidents/includes/incidents_menu.html' %}
<main role="main">
  <div class="container" >
    <!--TITULO Y BOTÓN REGRESAR-->
    <div class="row my-2">
      <div class="col-md-11">
        <h2 class="section-heading mb-4">BORRAR INCIDENTE</h2>
      </div>
      <div class="col-md-1">
        <div class="mb-3">
          <a href="javascript:history.back()" class="btn btn-light border-0 shadow-sm rounded-3 px-4 py-2">
            <i class="fa fa-arrow-left m-2 text-dark"></i>
          </a>
        </div>
      </div>
    </div>
    <div class="row mt-3">
      <div class="col-md-9 mx-auto" style="margin-top: 70px">
        <div>
          <form action="" method="post">
            {% csrf_token %}
            <p>¿Estás seguro de que quieres borrar <b>"{{ object }}"</b>?</p>
            <input
              type="submit"
              class="btn btn-danger btn-block mt-3 mb-3" 
              value="Sí, borrar el incidente"
            />
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
